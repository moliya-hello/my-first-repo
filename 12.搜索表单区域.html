<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tlias智能学习辅助系统</title>
  <style>
    /* 重置页面默认边距 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 顶部导航栏容器 */
    .header-nav {
      background-color: #4e5969;       /* 深灰蓝背景 */
      padding: 0 24px;                 /* 左右内边距 */
      height: 60px;                    /* 导航栏高度 */
      display: flex;                   /* 启用 Flex 布局 */
      justify-content: space-between;  /* 两端对齐：左侧靠左，右侧靠右 */
      align-items: center;             /* 垂直方向居中对齐 */
      border-bottom: 1px solid #e5e6eb;/* 底部分割线，提升层次感 */
    }

    /* 系统标题样式 */
    .header-title {
      font-size: 20px;
      font-weight: 900;                /* 特别加粗 */
      color: #ffffff;                  /* 白色文字，与深色背景形成对比 */
      letter-spacing: 0.5px;
      font-family: "楷体", KaiTi, STKaiti, serif;
    }

    /* 退出登录超链接样式 */
    .logout-btn {
      color: #e5e6eb;
      text-decoration: none;           /* 去除默认下划线 */
      font-size: 14px;
      font-weight: 500;
      padding: 6px 12px;               /* 扩大点击热区 */
      border-radius: 4px;
      transition: color 0.3s ease;
    }

    .logout-btn:hover {
      color: #f53f3f;                  /* 悬浮提示危险色（退出） */
      text-decoration: underline;
    }

    /* ===== 搜索表单区域 ===== */
    .search-form {
      display: flex;                   /* 表单项与按钮水平排成一行 */
      justify-content: space-between;  /* 左侧靠左，右侧靠右 */
      align-items: center;             /* 垂直方向居中对齐 */
      flex-wrap: wrap;                 /* 窗口变窄时自动换行，不会挤成一团 */
      gap: 16px;                       /* 各个表单项之间的间距 */
      padding: 20px 24px;
      background-color: #ffffff;
      border-bottom: 1px solid #e5e6eb;
    }

    /* 单个表单项：标签 + 控件，也用 flex 排成一行 */
    .form-item {
      display: flex;
      align-items: center;
      gap: 8px;                        /* 标签与输入框之间的间距 */
    }

    .form-item label {
      font-size: 14px;
      color: #4e5969;
      white-space: nowrap;             /* 标签文字不换行 */
    }

    /* 输入框与下拉框统一外观 */
    .form-item input,
    .form-item select {
      height: 34px;
      width: 160px;
      padding: 0 10px;
      font-size: 14px;
      color: #1d2129;
      border: 1px solid #c9cdd4;
      border-radius: 4px;
      outline: none;                   /* 去掉浏览器默认的焦点外框 */
      background-color: #ffffff;
      transition: border-color 0.3s ease;
    }

    /* 获得焦点时高亮边框，提示用户当前正在填哪一项 */
    .form-item input:focus,
    .form-item select:focus {
      border-color: #4e5969;
    }

    /* 按钮公共样式 */
    .search-form button {
      height: 34px;
      padding: 0 20px;
      font-size: 14px;
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;                 /* 鼠标移上去变成小手 */
      transition: background-color 0.3s ease;
    }

    /* 查询按钮：主要操作，用实心深色 */
    .btn-search {
      background-color: #4e5969;
      color: #ffffff;
    }

    .btn-search:hover {
      background-color: #3a4552;
    }

    /* 清空按钮：次要操作，用描边浅色 */
    .btn-reset {
      background-color: #ffffff;
      color: #4e5969;
      border-color: #c9cdd4;
    }

    .btn-reset:hover {
      background-color: #f2f3f5;
    }
  </style>
</head>
<body>

  <header class="header-nav">
    <div class="header-title">Tlias智能学习辅助系统</div>
    <a href="#logout" class="logout-btn">退出登录</a>
  </header>

  <!-- 搜索表单区域：三个表单项 + 两个操作按钮，水平排成一行 -->
  <form class="search-form" action="#" method="get">

    <div class="form-item">
      <label for="name">姓名</label>
      <input type="text" id="name" name="name" placeholder="请输入姓名">
    </div>

    <div class="form-item">
      <label for="gender">性别</label>
      <select id="gender" name="gender">
        <option value="">请选择</option>
        <option value="1">男</option>
        <option value="2">女</option>
      </select>
    </div>

    <div class="form-item">
      <label for="job">职位</label>
      <select id="job" name="job">
        <option value="">请选择</option>
        <option value="1">班主任</option>
        <option value="2">讲师</option>
        <option value="3">学工主管</option>
        <option value="4">教研主管</option>
        <option value="5">咨询师</option>
      </select>
    </div>

    <!-- submit：提交表单；reset：把所有表单项恢复到默认值 -->
    <button type="submit" class="btn-search">查询</button>
    <button type="reset" class="btn-reset">清空</button>

  </form>

</body>
</html>
